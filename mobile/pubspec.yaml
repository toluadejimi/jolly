name: giftfr
description: JollyBoxfr - gifting made easy. Browse products and track orders.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.1
  cached_network_image: ^3.3.0
  # Template UI
  figma_squircle: ^0.6.3
  dots_indicator: ^3.0.0
  flutter_svg: ^2.0.10+1
  floating_bottom_navigation_bar: ^1.5.2
  carousel_slider: ^5.0.0
  flutter_rating_bar: ^4.0.1
  dotted_line: ^3.2.2
  country_state_city_picker: ^1.2.8
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/data/
